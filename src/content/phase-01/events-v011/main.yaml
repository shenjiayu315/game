events:
  - id: awakening
    kind: fixed
    title: 黑暗中的第一次意识
    body:
      - 你醒在黑土、雨水和树皮之间。根须知道湿冷，树冠知道风，但你还不知道人声意味着什么。
      - 先承认这份意识，世界才会开始流动。
    phaseIds: [tree-awakening]
    priority: 120
    once: true
    trigger: { dateAtLeast: 1 }
    options:
      - id: awaken
        label: 让意识沉入根系
        preview: 开始本局；神树保持初醒状态，日期将在结果后自动流动。
        relatedModules: [tree]
        effects:
          - addHistory: { title: 神树初醒, text: 第一缕意识落入根系。 }
          - addActivity: { text: 神树在古树林地醒来。 }
        resultText:
          - 黑暗并没有退去，却开始有了方向。你的根须听见灵气在泥中缓慢流动。
  - id: roots-stirring
    kind: fixed
    title: 根下同时传来灵气、潮气与震动
    body:
      - 第一次雨水深入泥土。根须同时捕捉到灵气、低处潮意，以及不属于野兽的急促震动。
    phaseIds: [tree-awakening, roots-in-woods]
    priority: 100
    once: true
    trigger: { dateAtLeast: 4 }
    options:
      - id: take-aura
        label: 吞纳聚集的灵气
        preview: 神力+3；暂不追索外界线索。
        relatedModules: [tree]
        effects:
          - changePower: 3
          - changeFlag: { flag: delayed-trace, amount: 1 }
        resultText:
          - 你吞下雨后浮起的灵气。外界震动逐渐远去，但树身里的力量更实在。
      - id: follow-moisture
        label: 让根须追随潮意
        preview: 神力-1；开放地图线索，清溪探索+18。
        relatedModules: [map]
        effects:
          - changePower: -1
          - openModule: { module: map, access: partial }
          - setPhase: roots-in-woods
          - setRegionKnowledge: { region: clear-stream, knowledge: trace }
          - changeRegionExploration: { region: clear-stream, amount: 18 }
        resultText:
          - 潮意被根须牵住。低处有水，水边也许会有更多生命留下的痕迹。
      - id: follow-vibration
        label: 追索急促震动
        preview: 神力-1；南坡探索+15，人类线索+1。
        relatedModules: [map, characters]
        effects:
          - changePower: -1
          - openModule: { module: map, access: partial }
          - setPhase: roots-in-woods
          - setRegionKnowledge: { region: south-slope, knowledge: trace }
          - changeRegionExploration: { region: south-slope, amount: 15 }
          - changeFlag: { flag: human-trace, amount: 1 }
        resultText:
          - 那震动急促、凌乱，像逃跑，也像追赶。泥土里第一次有了人类的重量。
      - id: remain-still
        label: 暂时不惊动任何东西
        preview: 不消耗神力；沉默倾向+1，下一次线索更清晰。
        relatedModules: [tree, characters]
        effects:
          - addTendency: silent
          - changeFlag: { flag: watched-silently, amount: 1 }
        resultText:
          - 你没有伸出更远的根。林地在沉默里继续发声。
  - id: forest-after-rain
    kind: fixed
    title: 雨后的林地发生变化
    body:
      - 雨后的古树林地气息变重。水流、兽道和腐叶把几条方向推到你的感知边缘。
    phaseIds: [roots-in-woods]
    priority: 90
    once: true
    trigger: { dateAtLeast: 10 }
    options:
      - id: root-water
        label: 继续追随水意
        preview: 清溪探索+20；若进度足够，清溪进入感知。
        relatedModules: [map]
        effects:
          - changeRegionExploration: { region: clear-stream, amount: 20 }
          - setRegionKnowledge: { region: clear-stream, knowledge: sensed }
        resultText:
          - 水声不再只是方向。你知道了低处有一片清溪滩，那里能带来水，也会带来足迹。
      - id: root-slope
        label: 分辨断草和兽道
        preview: 南坡探索+20；发现狩猎与危险线索。
        relatedModules: [map]
        effects:
          - changeRegionExploration: { region: south-slope, amount: 20 }
          - setRegionKnowledge: { region: south-slope, knowledge: trace }
        resultText:
          - 南坡的草被反复踩断。兽类从那里经过，偶尔也有人从那里逃过。
      - id: strengthen-woods
        label: 稳固古树林地灵气
        preview: 神力上限+2；古树林地灵气+0.2/日。
        relatedModules: [tree, map]
        effects:
          - changePowerCap: 2
          - addAuraSource: { id: rain-fed-woods, label: 雨后林地灵气, amount: 0.2, module: map }
        resultText:
          - 你不急着离开树下。雨后灵气沉进根须，古树林地变得更像你的身体。
  - id: blood-in-soil
    kind: fixed
    title: 泥土中出现血与脚步
    body:
      - 林中出现了血。脚步从南坡方向拖向树下，后面还有更重、更低的震动。
    phaseIds: [roots-in-woods]
    priority: 95
    once: true
    trigger:
      all:
        - dateAtLeast: 18
        - any:
            - flag: human-trace
            - dateAtLeast: 20
    options:
      - id: prepare-shelter
        label: 升起根须准备庇护
        preview: 神力-3；芒到来时更容易保护她。
        relatedModules: [tree, characters]
        effects:
          - changePower: -3
          - setFlag: { flag: prepared-shelter, value: true }
          - openModule: { module: characters, access: hinted }
        resultText:
          - 你让浅根从泥中微微抬起。尚未到来的人类不会知道，树已经在等待。
      - id: watch-footprints
        label: 记住脚步来处
        preview: 南坡探索+15；保留神力。
        relatedModules: [map, characters]
        effects:
          - changeRegionExploration: { region: south-slope, amount: 15 }
          - addTendency: silent
        resultText:
          - 你没有惊动逃亡者，只记住脚步、血气和追逐的方向。
      - id: gather-for-miracle
        label: 把灵气收回树身
        preview: 神力+2；准备之后的神迹消耗。
        relatedModules: [tree]
        effects:
          - changePower: 2
        resultText:
          - 你把散在根端的灵气收回。若人类真的倒在树下，力量会比线索更重要。
  - id: mang-wounded
    kind: fixed
    title: 树下的伤者
    body:
      - 一个年轻女人跌进树影。她的腿被撕开，身后的灌木仍在摇动。
    phaseIds: [roots-in-woods, mang-arrival]
    priority: 110
    once: true
    trigger: { dateAtLeast: 24 }
    options:
      - id: heal-wound
        label: 以灵气封住伤口
        preview: 神力-8；认识受伤的陌生人，信任与感应提高。
        costHint: 神力-8
        relatedModules: [tree, characters]
        requirements:
          resourceAtLeast: { resource: power, value: 8 }
        effects:
          - changePower: -8
          - openModule: { module: characters, access: partial }
          - setPhase: mang-arrival
          - setCharacterKnowledge: { character: mang, knowledge: mentioned }
          - changeCharacter: { character: mang, stat: resonance, amount: 20 }
          - changeCharacter: { character: mang, stat: trust, amount: 16 }
          - addMemory: { character: mang, text: 树影封住了她的伤口。 }
          - addTendency: guardian
        resultText:
          - 伤口在根须旁缓慢闭合。她终于意识到，头顶的古树并非偶然遮住了她。
      - id: raise-roots
        label: 升起根须庇护她
        preview: 神力-4；赶走危险，恐惧与感应提高。
        costHint: 神力-4
        relatedModules: [tree, characters]
        effects:
          - changePower: -4
          - openModule: { module: characters, access: partial }
          - setPhase: mang-arrival
          - setCharacterKnowledge: { character: mang, knowledge: mentioned }
          - changeCharacter: { character: mang, stat: resonance, amount: 14 }
          - changeCharacter: { character: mang, stat: fear, amount: 10 }
          - addTendency: dread
        resultText:
          - 根须从泥中抬起，把灌木后的兽影逼退。她活了下来，也记住了树会动。
      - id: stay-silent
        label: 保持沉默
        preview: 保留神力；她会自行理解这次幸存。
        relatedModules: [characters]
        effects:
          - openModule: { module: characters, access: partial }
          - setPhase: mang-arrival
          - setCharacterKnowledge: { character: mang, knowledge: mentioned }
          - changeCharacter: { character: mang, stat: resonance, amount: 6 }
          - addTendency: silent
        resultText:
          - 她在树下熬过了夜。你没有回应，但她离开时回头看了很久。
  - id: mang-returns
    kind: fixed
    title: 她回来确认神树意志
    body:
      - 几日后，那个受伤的女人回到树下。她带着一小把草药和警惕，不知道该祈求还是逃开。
    phaseIds: [mang-arrival, private-offering]
    priority: 90
    once: true
    trigger: { dateAtLeast: 34 }
    options:
      - id: tell-name
        label: 以叶声回应她的名字
        preview: 神力-2；她的姓名“芒”进入认知，信任提高。
        relatedModules: [characters]
        effects:
          - changePower: -2
          - setPhase: private-offering
          - setCharacterKnowledge: { character: mang, knowledge: known }
          - changeCharacter: { character: mang, stat: trust, amount: 8 }
          - changeCharacter: { character: mang, stat: resonance, amount: 10 }
        resultText:
          - 她低声说自己叫芒。叶声没有语言，却在她心里留下了“被听见”的感觉。
      - id: stern-return
        label: 让枝影压低提醒敬畏
        preview: 神力-1；姓名解锁，恐惧提高。
        relatedModules: [characters, faith]
        effects:
          - changePower: -1
          - setPhase: private-offering
          - setCharacterKnowledge: { character: mang, knowledge: known }
          - changeCharacter: { character: mang, stat: fear, amount: 10 }
          - changeCollectiveFear: 2
          - addTendency: dread
        resultText:
          - 芒跪了下去。她仍会回来，但不是因为安心，而是因为确信古树不可冒犯。
      - id: let-her-speak
        label: 让她自己说完整件事
        preview: 保留神力；获得部落传闻。
        relatedModules: [characters, tribe]
        effects:
          - setPhase: private-offering
          - setCharacterKnowledge: { character: mang, knowledge: known }
          - openModule: { module: tribe, access: hinted }
          - addTendency: silent
        resultText:
          - 芒把自己的惊惧说给树听，也说起远处还有她的族人。他们缺粮，也有人受伤。
  - id: mang-tests-sign
    kind: fixed
    title: 芒留下记号测试回应
    body:
      - 芒在根旁摆了三块石子，又在树皮上系上一根草绳。她退到远处，等着看古树是否真的会回应。
    phaseIds: [private-offering]
    priority: 80
    once: true
    trigger: { dateAtLeast: 40 }
    options:
      - id: move-stone
        label: 移动最小的石子
        preview: 神力-2；感应与信任提高。
        relatedModules: [tree, characters]
        effects:
          - changePower: -2
          - changeCharacter: { character: mang, stat: resonance, amount: 10 }
          - changeCharacter: { character: mang, stat: trust, amount: 6 }
        resultText:
          - 石子轻轻滚到草绳下方。芒屏住呼吸，像终于收到一个只属于她的回答。
      - id: point-water
        label: 用草绳指向低地水声
        preview: 神力-2；清溪探索+18，芒影响力提高。
        relatedModules: [characters, map]
        effects:
          - changePower: -2
          - changeRegionExploration: { region: clear-stream, amount: 18 }
          - changeCharacter: { character: mang, stat: influence, amount: 4 }
        resultText:
          - 草绳指向低地。芒不完全明白，但她会把这个方向带回自己的脚步里。
      - id: ignore-test
        label: 不回应这场试探
        preview: 保留神力；沉默倾向提高。
        relatedModules: [tree]
        effects:
          - addTendency: silent
          - changeCharacter: { character: mang, stat: fear, amount: 2 }
        resultText:
          - 石子没有动。芒把沉默也当成一种回答，只是更难解释。
  - id: storm-under-tree
    kind: fixed
    title: 芒在暴雨中躲到树下
    body:
      - 夏季暴雨压弯树冠。芒冒雨躲到树下，她身上带着族人的疲惫气味。
    phaseIds: [private-offering]
    priority: 82
    once: true
    trigger: { dateAtLeast: 46 }
    options:
      - id: shelter-her
        label: 为她挡开暴雨
        preview: 神力-4；信任提高，部落传闻更清晰。
        relatedModules: [tree, characters, tribe]
        effects:
          - changePower: -4
          - changeCharacter: { character: mang, stat: trust, amount: 8 }
          - openModule: { module: tribe, access: hinted }
          - changeFlag: { flag: tribe-rumors, amount: 1 }
          - addTendency: guardian
        resultText:
          - 雨水绕开树下。芒第一次主动说起溪原部：他们迁徙、缺粮，并且有人不相信她。
      - id: thunder-warning
        label: 借雷声显示威严
        preview: 神力-3；恐惧提高，芒更可能传播敬畏。
        relatedModules: [tree, characters, faith]
        effects:
          - changePower: -3
          - changeCharacter: { character: mang, stat: fear, amount: 8 }
          - changeCollectiveFear: 3
          - addTendency: dread
        resultText:
          - 雷声在树冠上方炸开。芒把额头贴进泥里，记住了神树也拥有怒意。
      - id: listen-only
        label: 只听她谈起族人
        preview: 保留神力；部落传闻+1。
        relatedModules: [characters, tribe]
        effects:
          - openModule: { module: tribe, access: hinted }
          - changeFlag: { flag: tribe-rumors, amount: 1 }
          - addTendency: silent
        resultText:
          - 你没有替她挡雨。芒在雨里说了很久，像把无人相信的事交给树洞。
  - id: first-offering
    kind: fixed
    title: 第一份供奉
    body:
      - 芒在根旁放下一只盛水的粗陶碗，又压上一束新折的叶。她没有请求，只是在等待。
    phaseIds: [private-offering, distant-tribe]
    priority: 95
    once: true
    trigger: { dateAtLeast: 50 }
    options:
      - id: accept-water
        label: 接受清水与叶片
        preview: 建立低而稳定的个人信仰；芒信任提高。
        relatedModules: [faith, characters]
        effects:
          - openModule: { module: faith, access: partial }
          - setWorshipVisibility: personal
          - changeBelievers: 1
          - addFaithSource: { id: mang-water-leaves, label: 芒的清水与枝叶, amount: 0.2, module: faith }
          - changeCharacter: { character: mang, stat: trust, amount: 6 }
          - addTendency: guardian
        resultText:
          - 清水渗入根旁。芒明白供奉被接纳，于是个人的敬意开始成为稳定的神力来源。
      - id: demand-more
        label: 显示应当献上更多
        preview: 信仰收入更高；芒恐惧提高。
        relatedModules: [faith, characters]
        effects:
          - openModule: { module: faith, access: partial }
          - setWorshipVisibility: personal
          - changeBelievers: 1
          - addFaithSource: { id: mang-demanded-offering, label: 芒的畏惧供奉, amount: 0.35, module: faith }
          - changeCharacter: { character: mang, stat: fear, amount: 8 }
          - addTendency: dread
        resultText:
          - 陶碗旁的根须轻轻收紧。芒理解为古树索取更多，供奉也因此带上恐惧。
      - id: push-away
        label: 让根须推开陶碗
        preview: 暂不建立供奉；芒困惑但仍保持感应。
        relatedModules: [faith, characters]
        effects:
          - changeCharacter: { character: mang, stat: resonance, amount: 4 }
          - addTendency: silent
        resultText:
          - 陶碗被推离树根。芒不知道自己做错了什么，只能把这次拒绝记在心里。
  - id: distant-hunger
    kind: fixed
    title: 芒谈起族人的粮食问题
    body:
      - 芒说，溪原部今年采集不顺。她想知道神树是否能指一个不让族人挨饿的方向。
    phaseIds: [distant-tribe]
    priority: 88
    once: true
    trigger: { dateAtLeast: 55 }
    options:
      - id: hint-stream-food
        label: 暗示低地水源
        preview: 清溪探索+20；部落传闻继续增加。
        relatedModules: [map, tribe, characters]
        effects:
          - setPhase: distant-tribe
          - changeRegionExploration: { region: clear-stream, amount: 20 }
          - setRegionKnowledge: { region: clear-stream, knowledge: sensed }
          - changeFlag: { flag: tribe-rumors, amount: 1 }
        resultText:
          - 芒在梦中听见水声。她会把这当成寻找食物和水源的方向，而不是完整命令。
      - id: feed-by-power
        label: 赐下一次丰盛采集
        preview: 神力-6；部落粮食+8，芒信任提高。
        relatedModules: [tree, tribe, characters]
        requirements:
          resourceAtLeast: { resource: power, value: 6 }
        effects:
          - changePower: -6
          - changeFood: 8
          - changeCharacter: { character: mang, stat: trust, amount: 6 }
          - addTendency: guardian
        resultText:
          - 芒返回后找到一处被雨水冲出的块根。她会说这是树给的，但族人未必都相信。
      - id: keep-distance
        label: 不替远处的人群决定
        preview: 保留神力；沉默倾向提高。
        relatedModules: [tree, tribe]
        effects:
          - addTendency: silent
        resultText:
          - 你没有回应饥饿。芒只能把沉默带回部落，那里会继续用人的办法解决人的困境。
  - id: request-for-wounded
    kind: fixed
    title: 芒替未曾露面的伤者祈求
    body:
      - 芒带来一截染血的布。她说族里还有人伤得很重，却不敢靠近古树。
    phaseIds: [distant-tribe]
    priority: 86
    once: true
    trigger: { dateAtLeast: 58 }
    options:
      - id: distant-blessing
        label: 给她带回微弱祝福
        preview: 神力-6；伤病-1，芒影响力提高。
        relatedModules: [tree, characters, tribe]
        requirements:
          resourceAtLeast: { resource: power, value: 6 }
        effects:
          - changePower: -6
          - changeInjuries: -1
          - changeCharacter: { character: mang, stat: influence, amount: 6 }
          - addTendency: guardian
        resultText:
          - 叶上的露水被芒带走。它不是完整神迹，却足够让一个伤者撑过夜晚。
      - id: require-approach
        label: 要他们亲自来到树下
        preview: 恐惧与期待提高；推动部落来临。
        relatedModules: [characters, tribe, faith]
        effects:
          - changeCollectiveFaith: 3
          - changeCollectiveFear: 3
          - changeCharacter: { character: mang, stat: fear, amount: 3 }
          - addTendency: dread
        resultText:
          - 芒理解为：神树不拒绝伤者，但人必须亲自来到树下，承担靠近神的代价。
      - id: refuse-prayer
        label: 拒绝替陌生人耗费力量
        preview: 保留神力；芒信任下降、恐惧上升。
        relatedModules: [characters]
        effects:
          - changeCharacter: { character: mang, stat: trust, amount: -4 }
          - changeCharacter: { character: mang, stat: fear, amount: 4 }
          - addTendency: silent
        resultText:
          - 布条被风吹回芒脚边。她脸色发白，却没有争辩。
  - id: divided-story
    kind: fixed
    title: 芒发现族人并不相信同一个故事
    body:
      - 芒说，有人相信古树救过她，也有人认为她只是把幸存说成神迹。故事开始分裂。
    phaseIds: [distant-tribe]
    priority: 84
    once: true
    trigger: { dateAtLeast: 60 }
    options:
      - id: strengthen-mang
        label: 强化芒作为中介
        preview: 神力-4；芒影响力提高，解释权更集中。
        relatedModules: [characters, faith]
        effects:
          - changePower: -4
          - changeCharacter: { character: mang, stat: influence, amount: 8 }
          - setInterpreter: mang
        resultText:
          - 芒再次梦见树下的伤口愈合。她更敢说，也更像神树的第一位解释者。
      - id: invite-witnesses
        label: 让更多人亲眼来到树下
        preview: 推动部落公开接触；信仰与恐惧同时提高。
        relatedModules: [tribe, faith]
        effects:
          - changeCollectiveFaith: 4
          - changeCollectiveFear: 2
          - setPhase: tribe-arrival
        resultText:
